name: V40 agent cockpit UI patch

on:
  push:
    branches:
      - v40-agentic-sourcing-cockpit
    paths:
      - .github/workflows/v40-ui-patch.yml

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out V40 branch
        uses: actions/checkout@v4
        with:
          ref: v40-agentic-sourcing-cockpit
          fetch-depth: 0

      - name: Apply agent cockpit integration
        run: python scripts/v40_ui_patch.py

      - name: Remove one-shot patch scaffolding
        run: git rm .github/workflows/v40-ui-patch.yml scripts/v40_ui_patch.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-public/components/SearchWorkspaceV38_1.tsx next-public/components/SearchWorkspaceV38_1.module.css next-public/tests/v40-agentic-foundation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "V40 surface live agent activity and durable memory capture"
          git push origin HEAD:v40-agentic-sourcing-cockpit
