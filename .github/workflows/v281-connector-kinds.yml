name: V28.1 classify connector results

on:
  push:
    branches:
      - v28-1-product-truth-reconstruction
    paths:
      - scripts/v281-connector-kinds.mjs
      - .github/workflows/v281-connector-kinds.yml

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v28-1-product-truth-reconstruction
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/v281-connector-kinds.mjs
      - name: Commit connector classifications
        run: |
          if git diff --quiet; then
            echo "No connector change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-public/lib/source-connectors.ts
          git commit -m "Require explicit entity kind from every connector"
          git push origin HEAD:v28-1-product-truth-reconstruction
