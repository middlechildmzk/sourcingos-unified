name: V39.1 person search contact density patch

on:
  push:
    branches:
      - hotfix-v39-1-person-search-contact-density
    paths:
      - .github/workflows/hotfix-v39-1-person-search-contact-density.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-v39-1-person-search-contact-density
      - name: Patch recruiter search UX regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          person = Path('next-public/components/PersonLookupV38_4.tsx')
          text = person.read_text()
          old = '''  async function searchGraph(event?: FormEvent) {
    event?.preventDefault()
    const value = query.trim()
    if (!value || status) return
    setError(''); setSearched(true); setStatus('graph'); setLive([]); setSigned([])
    try {
      const response = await fetch(`/api/candidate-db/list?q=${encodeURIComponent(value)}&limit=20`, { cache: 'no-store', headers: { accept: 'application/json' } })
      const json = await response.json().catch(() => ({}))
      if (!response.ok || !json.ok) throw new Error(json.error || 'Candidate Graph lookup failed.')
      setGraphCandidates(Array.isArray(json.candidates) ? json.candidates.filter((item: GraphCandidate & { entityKind?: string }) => !item.entityKind || item.entityKind === 'person') : [])
    } catch (caught) {
      setError(caught instanceof Error ? caught.message : 'Candidate Graph lookup failed.')
    } finally { setStatus('') }
  }

  async function searchLive() {
    const value = query.trim()
    if (!value || status) return
    setError(''); setStatus('live')
    try {
      // Known-person lookup is an identity retrieval workflow, not a role-search
      // planning workflow. Preserve the recruiter-entered identity anchor exactly
      // and search connected sources without asking Role Brain to reinterpret it.
      const response = await fetch('/api/candidate-data/search', {
        method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify({ query: value, limit: 12, highFreshness: false }),
      })
      const json = await response.json().catch(() => ({}))
      if (!response.ok || !json.ok) throw new Error(json.error || 'Live person lookup failed.')
      setLive(Array.isArray(json.observations) ? json.observations : [])
      setSigned(Array.isArray(json.reviewObservations) ? json.reviewObservations : [])
      setSearched(true)
    } catch (caught) {
      setError(caught instanceof Error ? caught.message : 'Live person lookup failed.')
    } finally { setStatus('') }
  }
'''
          new = '''  async function searchLiveForValue(value: string) {
    setStatus('live')
    try {
      // Known-person lookup is an identity retrieval workflow, not a role-search
      // planning workflow. Preserve the recruiter-entered identity anchor exactly
      // and search connected sources without asking Role Brain to reinterpret it.
      const response = await fetch('/api/candidate-data/search', {
        method: 'POST', headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify({ query: value, limit: 12, highFreshness: false }),
      })
      const json = await response.json().catch(() => ({}))
      if (!response.ok || !json.ok) throw new Error(json.error || 'Live person lookup failed.')
      setLive(Array.isArray(json.observations) ? json.observations : [])
      setSigned(Array.isArray(json.reviewObservations) ? json.reviewObservations : [])
      setSearched(true)
      return true
    } catch (caught) {
      setError(caught instanceof Error ? caught.message : 'Live person lookup failed.')
      return false
    }
  }

  async function searchGraph(event?: FormEvent) {
    event?.preventDefault()
    const value = query.trim()
    if (!value || status) return
    setError(''); setSearched(true); setStatus('graph'); setGraphCandidates([]); setLive([]); setSigned([])
    try {
      const response = await fetch(`/api/candidate-db/list?q=${encodeURIComponent(value)}&limit=20`, { cache: 'no-store', headers: { accept: 'application/json' } })
      const json = await response.json().catch(() => ({}))
      if (!response.ok || !json.ok) throw new Error(json.error || 'Candidate Graph lookup failed.')
      const candidates = Array.isArray(json.candidates) ? json.candidates.filter((item: GraphCandidate & { entityKind?: string }) => !item.entityKind || item.entityKind === 'person') : []
      setGraphCandidates(candidates)
      if (candidates.length === 0) await searchLiveForValue(value)
    } catch (caught) {
      setError(caught instanceof Error ? caught.message : 'Candidate Graph lookup failed.')
    } finally { setStatus('') }
  }

  async function searchLive() {
    const value = query.trim()
    if (!value || status) return
    setError('')
    await searchLiveForValue(value)
    setStatus('')
  }
'''
          assert old in text, 'PersonLookup search functions drifted'
          text = text.replace(old, new)
          text = text.replace("<p>Start with SourcingOS’s Candidate Graph. If the person is not already there, search live connected sources. Contact enrichment remains an explicit recruiter-approved action.</p>", "<p>Search once: SourcingOS checks the Candidate Graph first, then automatically searches live connected sources when no stored person matches. Contact enrichment remains an explicit recruiter-approved action.</p>")
          text = text.replace("{status === 'graph' ? 'Searching…' : 'Search Candidate Graph'}", "{status === 'graph' ? 'Checking saved graph…' : status === 'live' ? 'Searching live sources…' : 'Find person'}")
          text = text.replace("<div className={styles.liveRow}><span>Need broader coverage or a fresh identity?</span><button type=\"button\" onClick={searchLive} disabled={!exactPrompt || Boolean(status)}>{status === 'live' ? 'Searching live sources…' : 'Search live sources'}</button></div>", "<div className={styles.liveRow}><span>Want fresh coverage even when a stored profile exists?</span><button type=\"button\" onClick={searchLive} disabled={!exactPrompt || Boolean(status)}>{status === 'live' ? 'Searching live sources…' : 'Refresh live sources'}</button></div>")
          text = text.replace("{graphCandidates.length === 0 && <small>No stored person matched this lookup yet.</small>}", "{graphCandidates.length === 0 && <small>No stored match. Live sources are checked automatically.</small>}")
          person.write_text(text)

          row = Path('next-public/components/CandidateRow.tsx')
          text = row.read_text()
          old = '''      <span className={`candidate-contact-state ${email.className}`}>Email {email.text}</span>
      <span className={`candidate-contact-state ${phone.className}`}>Phone {phone.text}</span>
'''
          new = '''      {email.text !== 'Unknown' && <span className={`candidate-contact-state ${email.className}`}>Email {email.text}</span>}
      {phone.text !== 'Unknown' && <span className={`candidate-contact-state ${phone.className}`}>Phone {phone.text}</span>}
      {email.text === 'Unknown' && phone.text === 'Unknown' && <span className="candidate-contact-state is-muted">Contact not checked</span>}
'''
          assert old in text, 'CandidateRow contact block drifted'
          row.write_text(text.replace(old, new))

          workspace = Path('next-public/components/SearchWorkspaceV38_1.tsx')
          text = workspace.read_text()
          old = "function contactLabel(value: boolean | 'unknown' | undefined) { return value === true ? 'Available' : value === false ? 'Not returned' : 'Unknown' }"
          new = "function contactLabel(value: boolean | 'unknown' | undefined) { return value === true ? 'Available' : value === false ? 'Not returned' : 'Not checked' }"
          assert old in text, 'SearchWorkspace contact label drifted'
          workspace.write_text(text.replace(old, new))

          module = Path('next-public/components/SearchWorkspaceV38_1.module.css')
          text = module.read_text()
          old = "@media(min-width:1350px){:global(.search-workspace){grid-template-columns:minmax(240px,280px) minmax(460px,1fr) minmax(390px,460px)}}"
          new = "@media(min-width:1350px){:global(.search-workspace){grid-template-columns:minmax(220px,240px) minmax(600px,1fr) minmax(360px,410px)}}"
          assert old in text, 'SearchWorkspace desktop columns drifted'
          text = text.replace(old, new)
          text = text.replace(".nextSteps strong{display:block;font-size:11px}.nextSteps span{display:block;color:var(--muted);font-size:10px", ".nextSteps strong{display:block;font-size:12px}.nextSteps span{display:block;color:var(--muted);font-size:11px")
          text = text.replace(".timelineItem strong{display:block;font-size:11px}.timelineItem span{display:block;color:var(--muted);font-size:10px", ".timelineItem strong{display:block;font-size:12px}.timelineItem span{display:block;color:var(--muted);font-size:11px")
          text = text.replace(".timelineItem p{margin:5px 0 0;color:#b6c0cf;font-size:10px", ".timelineItem p{margin:5px 0 0;color:#b6c0cf;font-size:11px")
          module.write_text(text)

          lookup_css = Path('next-public/components/PersonLookupV38_4.module.css')
          text = lookup_css.read_text()
          text = text.replace(".hero h1{margin:7px 0 6px;font-size:24px", ".hero h1{margin:7px 0 6px;font-size:27px")
          text = text.replace(".hero p{max-width:760px;margin:0;color:var(--muted);font-size:12px", ".hero p{max-width:860px;margin:0;color:var(--muted);font-size:13px")
          text = text.replace("padding:11px 12px;font-size:12px;outline:none", "padding:12px 13px;font-size:14px;outline:none")
          text = text.replace("padding:9px 11px;font-size:10px;font-weight:800", "padding:10px 12px;font-size:11px;font-weight:800")
          text = text.replace("color:var(--muted);font-size:10px}.liveRow button", "color:var(--muted);font-size:11px}.liveRow button")
          text = text.replace(".card h2{margin:0;font-size:15px}.card p{margin:4px 0 0;color:var(--muted);font-size:10px", ".card h2{margin:0;font-size:17px}.card p{margin:4px 0 0;color:var(--muted);font-size:11px")
          lookup_css.write_text(text)

          css = Path('next-public/app/app/search-workspace.css')
          text = css.read_text()
          marker = '/* V39.1 recruiter readability hotfix */'
          assert marker not in text, 'readability override already present'
          text += '''\n\n/* V39.1 recruiter readability hotfix */
@media(min-width:1350px){
  .search-workspace-left{padding:20px 15px}
  .search-workspace-center{padding:20px 20px 48px}
}
.candidate-slate{gap:8px}
.candidate-row{grid-template-columns:32px minmax(0,1fr) 118px;gap:12px;padding:14px 13px;border-radius:12px}
.candidate-row-rank{width:28px;height:28px;font-size:10px}
.candidate-row-name-line strong{font-size:14px}
.candidate-source{font-size:8px;padding:3px 6px}
.candidate-row-role{font-size:11px;margin-top:3px}
.candidate-row-location{font-size:10px;margin-top:2px}
.candidate-row-skills{gap:4px;margin-top:7px}.candidate-row-skills>span{font-size:9px;padding:4px 6px}
.candidate-row-why{font-size:9px;line-height:1.5;margin-top:7px}.candidate-row-why b{font-size:8px}
.candidate-row-side{gap:5px}.candidate-evidence-count,.candidate-contact-state,.candidate-open-label{font-size:9px}
.candidate-inspector-identity,.candidate-inspector-section{padding:16px}
.candidate-inspector-identity h2{font-size:22px}.candidate-inspector-identity p{font-size:12px;line-height:1.45}.candidate-inspector-identity small{font-size:10px}
.search-section-title>span{font-size:10.5px}.search-plan-summary{font-size:12px}.search-empty-copy{font-size:11px}
.inspector-contact-grid small{font-size:9px}.inspector-contact-grid b{font-size:11px}
'''
          css.write_text(text)

          test = Path('next-public/tests/v39-1-person-search-contact-density.test.ts')
          test.write_text('''import { describe, expect, it } from 'vitest'\nimport fs from 'node:fs'\nimport path from 'node:path'\n\nconst read = (relative: string) => fs.readFileSync(path.join(process.cwd(), relative), 'utf8')\n\ndescribe('V39.1 recruiter search regression guard', () => {\n  it('automatically falls through to live sources after a zero-match Candidate Graph lookup', () => {\n    const source = read('components/PersonLookupV38_4.tsx')\n    expect(source).toContain('if (candidates.length === 0) await searchLiveForValue(value)')\n    expect(source).toContain("'Find person'")\n    expect(source).toContain('Live sources are checked automatically.')\n  })\n\n  it('does not render repetitive Email Unknown / Phone Unknown rows when contact has not been checked', () => {\n    const source = read('components/CandidateRow.tsx')\n    expect(source).toContain('Contact not checked')\n    expect(source).toContain("email.text !== 'Unknown'")\n    expect(source).toContain("phone.text !== 'Unknown'")\n  })\n\n  it('gives the candidate list more desktop width and a larger readable type scale', () => {\n    const moduleCss = read('components/SearchWorkspaceV38_1.module.css')\n    const workspaceCss = read('app/app/search-workspace.css')\n    expect(moduleCss).toContain('minmax(600px,1fr)')\n    expect(workspaceCss).toContain('.candidate-row-name-line strong{font-size:14px}')\n    expect(workspaceCss).toContain('grid-template-columns:32px minmax(0,1fr) 118px')\n  })\n})\n''')
          PY
      - name: Commit hotfix changes
        shell: bash
        run: |
          git config user.name "middlechildmzk"
          git config user.email "277354675+middlechildmzk@users.noreply.github.com"
          git add next-public/components/PersonLookupV38_4.tsx next-public/components/PersonLookupV38_4.module.css next-public/components/CandidateRow.tsx next-public/components/SearchWorkspaceV38_1.tsx next-public/components/SearchWorkspaceV38_1.module.css next-public/app/app/search-workspace.css next-public/tests/v39-1-person-search-contact-density.test.ts
          git diff --cached --check
          git commit -m "Hotfix person lookup fallback, contact state, and search readability"
          git push origin HEAD:hotfix-v39-1-person-search-contact-density
