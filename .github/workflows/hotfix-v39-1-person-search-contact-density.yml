name: V39.1 person search contact density patch

on:
  push:
    branches:
      - hotfix-v39-1-person-search-contact-density
    paths:
      - .github/scripts/patch_v39_1_person_search_contact_density.py
      - .github/workflows/hotfix-v39-1-person-search-contact-density.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-v39-1-person-search-contact-density
      - name: Apply recruiter UX hotfix
        run: python .github/scripts/patch_v39_1_person_search_contact_density.py
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name "middlechildmzk"
          git config user.email "277354675+middlechildmzk@users.noreply.github.com"
          git add \
            next-public/components/PersonLookupV38_4.tsx \
            next-public/components/PersonLookupV38_4.module.css \
            next-public/components/CandidateRow.tsx \
            next-public/components/SearchWorkspaceV38_1.tsx \
            next-public/components/SearchWorkspaceV38_1.module.css \
            next-public/app/app/search-workspace.css \
            next-public/tests/v39-1-person-search-contact-density.test.ts
          git diff --cached --check
          git commit -m "Hotfix person lookup fallback, contact state, and search readability"
          git push origin HEAD:hotfix-v39-1-person-search-contact-density
