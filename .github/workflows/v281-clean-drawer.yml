name: V28.1 clean Candidate Drawer

on:
  push:
    branches:
      - v28-1-product-truth-reconstruction
    paths:
      - scripts/v281-clean-drawer.mjs
      - .github/workflows/v281-clean-drawer.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v28-1-product-truth-reconstruction
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/v281-clean-drawer.mjs
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-public/components/CandidateDrawer.tsx
          git commit -m "Remove duplicate Candidate Drawer transform artifacts"
          git push origin HEAD:v28-1-product-truth-reconstruction
