name: V40.7d provider-agnostic synthesis integration
on:
  push:
    branches: [v40-7d-provider-agnostic-fleet-synthesis]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v40-7d-provider-agnostic-fleet-synthesis
          fetch-depth: 0
      - name: Apply provider-agnostic fleet synthesis
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          runtime = Path('next-public/lib/fleet/runtime-v40-7b.ts')
          text = runtime.read_text()

          text = text.replace(
            "} from './improvement-workflow-v40-7'\n",
            "} from './improvement-workflow-v40-7'\nimport { resolveFleetSynthesisProviderV40_7c } from './synthesis-provider-v40-7c'\n",
            1,
          )
          text = text.replace(
            "  anthropic: boolean\n",
            "  synthesisGateway: boolean\n  anthropic: boolean\n",
            1,
          )
          text = text.replace(
            "    anthropic: Boolean(env.ANTHROPIC_API_KEY || env.AI_PROVIDER_API_KEY),\n",
            "    synthesisGateway: Boolean(env.AI_GATEWAY_API_KEY || env.VERCEL_OIDC_TOKEN),\n    anthropic: Boolean(env.ANTHROPIC_API_KEY),\n",
            1,
          )

          pattern = re.compile(r"async function runAnthropicWorkV40_7b\(input: \{.*?\n\}\n\nexport async function executeFleetWorkItemV40_7b", re.S)
          replacement = r'''async function runGatewayWorkV40_7d(input: {
            item: FleetWorkItemV40_7
            artifacts: FleetResearchArtifactV40_7b[]
            providerWarning?: string
            model: string
            authToken: string
          }): Promise<{ model: string; output: ReturnType<typeof parseAgentJson> }> {
            const prompt = fleetSynthesisPromptV40_7d(input)
            const response = await fetch('https://ai-gateway.vercel.sh/v1/responses', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${input.authToken}`,
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: input.model,
                input: [{ type: 'message', role: 'user', content: prompt }],
                max_output_tokens: 1200,
              }),
              cache: 'no-store',
            })
            if (!response.ok) {
              const detail = clean(await response.text().catch(() => ''), 1200)
              throw new Error(`Vercel AI Gateway fleet worker returned HTTP ${response.status}${detail ? `: ${detail}` : '.'}`)
            }
            const payload = await response.json() as Record<string, unknown>
            const directText = clean(payload.output_text, 8000)
            const output = Array.isArray(payload.output) ? payload.output : []
            const parts = output.flatMap(value => {
              const row = value && typeof value === 'object' ? value as Record<string, unknown> : {}
              const content = Array.isArray(row.content) ? row.content : []
              return content.map(part => {
                const block = part && typeof part === 'object' ? part as Record<string, unknown> : {}
                return clean(block.text, 8000)
              }).filter(Boolean)
            })
            const text = directText || parts.join('\n')
            if (!text) throw new Error('Vercel AI Gateway fleet worker returned no text output.')
            return {
              model: clean(payload.model, 200) || input.model,
              output: parseAgentJson(text),
            }
          }

          function fleetSynthesisPromptV40_7d(input: {
            item: FleetWorkItemV40_7
            artifacts: FleetResearchArtifactV40_7b[]
            providerWarning?: string
          }): string {
            return [
              'You are one bounded SourcingOS improvement-fleet worker. Return only JSON with keys summary, findings, recommended_next_actions.',
              'Keep the JSON concise: at most 6 findings and 6 recommended actions.',
              `Pod: ${input.item.pod}`,
              `Seat: ${input.item.seat}`,
              `Mode: ${input.item.mode}`,
              `Workstream: ${input.item.workstream}`,
              `Target: ${input.item.target}`,
              `Context refs: ${input.item.contextRefs.join(', ') || 'none'}`,
              '',
              'Binding constraints:',
              '- public professional evidence and primary documentation only',
              '- never scrape LinkedIn or account-gated pages',
              '- never bypass authentication, paywalls, CAPTCHA, robots/access controls, or private storage',
              '- never harvest contacts unattended',
              '- never silently merge identities',
              '- never send outreach or make a hiring/rejection decision',
              '- never claim, requeue, release, or modify Resume/CV sprint work',
              '- do not purchase or upgrade providers',
              '- treat missing evidence as unknown, not failure',
              '- distinguish search/discovery terms from actual candidate evidence',
              '- recommendations may propose branch-scoped engineering work, but this worker has no production-write authority',
              '',
              input.providerWarning ? `Provider warning: ${input.providerWarning}` : '',
              input.artifacts.length ? `Available attributable context:\n${sourceContext(input.artifacts)}` : 'No additional source context was retrieved. Work from the task definition and clearly mark any uncertainty.',
              '',
              'Produce concrete, deduplicated findings and next actions that another orchestrator can rank. Avoid generic advice.',
            ].filter(Boolean).join('\n')
          }

          async function runAnthropicWorkV40_7b(input: {
            item: FleetWorkItemV40_7
            artifacts: FleetResearchArtifactV40_7b[]
            providerWarning?: string
            model: string
            key: string
          }): Promise<{ model: string; output: ReturnType<typeof parseAgentJson> }> {
            const prompt = fleetSynthesisPromptV40_7d(input)
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'x-api-key': input.key,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
              },
              body: JSON.stringify({
                model: input.model,
                max_tokens: 1200,
                messages: [{ role: 'user', content: prompt }],
              }),
              cache: 'no-store',
            })
            if (!response.ok) {
              const detail = clean(await response.text().catch(() => ''), 1200)
              throw new Error(`Anthropic fleet worker returned HTTP ${response.status}${detail ? `: ${detail}` : '.'}`)
            }
            const payload = await response.json() as Record<string, unknown>
            const blocks = Array.isArray(payload.content) ? payload.content : []
            const text = blocks.map(value => {
              const row = value && typeof value === 'object' ? value as Record<string, unknown> : {}
              return row.type === 'text' ? clean(row.text, 8000) : ''
            }).filter(Boolean).join('\n')
            return { model: input.model, output: parseAgentJson(text) }
          }

          async function runAiSynthesisV40_7d(input: {
            item: FleetWorkItemV40_7
            artifacts: FleetResearchArtifactV40_7b[]
            providerWarning?: string
          }): Promise<{ model: string; output: ReturnType<typeof parseAgentJson> }> {
            const provider = resolveFleetSynthesisProviderV40_7c(process.env)
            if (provider.kind === 'gateway') {
              const authToken = provider.authSource === 'ai_gateway_api_key'
                ? process.env.AI_GATEWAY_API_KEY
                : process.env.VERCEL_OIDC_TOKEN
              if (!authToken) throw new Error('Vercel AI Gateway authentication resolved without an available token.')
              return runGatewayWorkV40_7d({ ...input, model: provider.model, authToken })
            }
            if (provider.kind === 'anthropic') {
              if (!process.env.ANTHROPIC_API_KEY) throw new Error('Anthropic synthesis resolved without ANTHROPIC_API_KEY.')
              return runAnthropicWorkV40_7b({ ...input, model: provider.model, key: process.env.ANTHROPIC_API_KEY })
            }
            throw new Error('No fleet synthesis provider is configured. Vercel AI Gateway OIDC/API key or Anthropic API key is required.')
          }

          export async function executeFleetWorkItemV40_7b'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit('Could not replace Anthropic synthesis block')
          text = text.replace('const agent = await runAnthropicWorkV40_7b({', 'const agent = await runAiSynthesisV40_7d({', 1)
          runtime.write_text(text)

          route = Path('next-public/app/api/cron/fleet-activation/route.ts')
          route_text = route.read_text()
          route_text = route_text.replace("const FIVE_BATCH = 'v40-7c-live-5-v2'", "const FIVE_BATCH = 'v40-7d-live-5'")
          route_text = route_text.replace("const TEN_BATCH = 'v40-7c-live-10'", "const TEN_BATCH = 'v40-7d-live-10'")
          route_text = route_text.replace("const FIFTY_BATCH = 'v40-7c-live-50'", "const FIFTY_BATCH = 'v40-7d-live-50'")
          route_text = route_text.replace(
            "    if (!readiness.anthropic) {\n      return NextResponse.json({ ok: false, stage: 'live_fleet', hold: true, reason: 'Anthropic is not configured for live fleet synthesis.', readiness }, { status: 409 })\n    }",
            "    if (!readiness.synthesisGateway && !readiness.anthropic) {\n      return NextResponse.json({ ok: false, stage: 'live_fleet', hold: true, reason: 'No live fleet synthesis provider is configured. Vercel AI Gateway OIDC/API-key auth or Anthropic is required.', readiness }, { status: 409 })\n    }",
          )
          route.write_text(route_text)
          PY

          cat > next-public/lib/fleet/synthesis-provider-v40-7c.ts <<'TS'
          export type FleetSynthesisResolutionV40_7c =
            | { kind: 'gateway'; model: string; authSource: 'ai_gateway_api_key' | 'vercel_oidc' }
            | { kind: 'anthropic'; model: string; authSource: 'anthropic_api_key' }
            | { kind: 'unavailable'; model: null; authSource: null }

          function value(env: Record<string, string | undefined>, key: string): string {
            return String(env[key] || '').trim()
          }

          function gatewayModel(env: Record<string, string | undefined>): string {
            const explicit = value(env, 'AGENT_FLEET_GATEWAY_MODEL')
            if (explicit.includes('/')) return explicit
            const fleet = value(env, 'AGENT_FLEET_MODEL')
            if (fleet.includes('/')) return fleet
            const generic = value(env, 'AI_PROVIDER_MODEL')
            if (generic.includes('/')) return generic
            return 'openai/gpt-5.6-sol'
          }

          function anthropicModel(env: Record<string, string | undefined>): string {
            const candidates = [
              value(env, 'AGENT_FLEET_MODEL'),
              value(env, 'ANTHROPIC_MODEL'),
              value(env, 'AI_PROVIDER_MODEL'),
            ]
            return candidates.find(model => /^claude[-/]/i.test(model)) || 'claude-sonnet-4-6'
          }

          export function resolveFleetSynthesisProviderV40_7c(
            env: Record<string, string | undefined>,
          ): FleetSynthesisResolutionV40_7c {
            if (value(env, 'AI_GATEWAY_API_KEY')) {
              return { kind: 'gateway', model: gatewayModel(env), authSource: 'ai_gateway_api_key' }
            }
            if (value(env, 'VERCEL_OIDC_TOKEN')) {
              return { kind: 'gateway', model: gatewayModel(env), authSource: 'vercel_oidc' }
            }
            if (value(env, 'ANTHROPIC_API_KEY')) {
              return { kind: 'anthropic', model: anthropicModel(env), authSource: 'anthropic_api_key' }
            }
            return { kind: 'unavailable', model: null, authSource: null }
          }
          TS

          cat > next-public/tests/v40-7d-provider-agnostic-synthesis.test.ts <<'TS'
          import { describe, expect, it } from 'vitest'
          import { resolveFleetSynthesisProviderV40_7c } from '@/lib/fleet/synthesis-provider-v40-7c'

          describe('V40.7d fleet synthesis provider resolution', () => {
            it('prefers an explicit AI Gateway key over Anthropic', () => {
              expect(resolveFleetSynthesisProviderV40_7c({
                AI_GATEWAY_API_KEY: 'gateway',
                ANTHROPIC_API_KEY: 'anthropic',
              })).toEqual({ kind: 'gateway', model: 'openai/gpt-5.6-sol', authSource: 'ai_gateway_api_key' })
            })

            it('uses Vercel OIDC without requiring another secret', () => {
              expect(resolveFleetSynthesisProviderV40_7c({ VERCEL_OIDC_TOKEN: 'oidc' })).toEqual({
                kind: 'gateway',
                model: 'openai/gpt-5.6-sol',
                authSource: 'vercel_oidc',
              })
            })

            it('honors a provider-qualified fleet gateway model', () => {
              expect(resolveFleetSynthesisProviderV40_7c({
                VERCEL_OIDC_TOKEN: 'oidc',
                AGENT_FLEET_GATEWAY_MODEL: 'google/gemini-3.6-flash',
              })).toEqual({ kind: 'gateway', model: 'google/gemini-3.6-flash', authSource: 'vercel_oidc' })
            })

            it('ignores a legacy non-gateway Claude model when resolving Gateway', () => {
              expect(resolveFleetSynthesisProviderV40_7c({
                VERCEL_OIDC_TOKEN: 'oidc',
                AGENT_FLEET_MODEL: 'claude-sonnet-4-6',
              }).model).toBe('openai/gpt-5.6-sol')
            })

            it('falls back to Anthropic only when Gateway auth is unavailable', () => {
              expect(resolveFleetSynthesisProviderV40_7c({
                ANTHROPIC_API_KEY: 'anthropic',
                ANTHROPIC_MODEL: 'claude-sonnet-4-6',
              })).toEqual({ kind: 'anthropic', model: 'claude-sonnet-4-6', authSource: 'anthropic_api_key' })
            })

            it('fails closed when no synthesis provider is configured', () => {
              expect(resolveFleetSynthesisProviderV40_7c({})).toEqual({
                kind: 'unavailable',
                model: null,
                authSource: null,
              })
            })
          })
          TS
      - name: Remove one-time workflow and verify scope
        shell: bash
        run: |
          rm .github/workflows/v40-7d-provider-agnostic-synthesis.yml
          git diff --check
          git status --short
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "next-public/app/api/cron/fleet-activation/route.ts next-public/lib/fleet/runtime-v40-7b.ts next-public/lib/fleet/synthesis-provider-v40-7c.ts next-public/tests/v40-7d-provider-agnostic-synthesis.test.ts "
      - name: Commit provider-agnostic synthesis
        shell: bash
        run: |
          git config user.name "SourcingOS Integration"
          git config user.email "actions@users.noreply.github.com"
          git add next-public/app/api/cron/fleet-activation/route.ts next-public/lib/fleet/runtime-v40-7b.ts next-public/lib/fleet/synthesis-provider-v40-7c.ts next-public/tests/v40-7d-provider-agnostic-synthesis.test.ts
          git commit -m "V40.7d provider-agnostic fleet synthesis"
          git push origin HEAD:v40-7d-provider-agnostic-fleet-synthesis
