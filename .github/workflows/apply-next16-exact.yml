name: Apply exact Next 16.3.3 patch

on:
  push:
    branches:
      - chore/next-16-3-3
    paths:
      - .github/workflows/apply-next16-exact.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact transfer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/next-16-3-3

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: next-public/package-lock.json

      - name: Rehydrate and authenticate exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .next16-patch/chunk-* | base64 -d | gzip -d > /tmp/sourcingos-next-16-3-3.patch
          test "$(wc -c < /tmp/sourcingos-next-16-3-3.patch)" -eq 222027
          echo "3c626200108f5bcd5c35361ddce61dc51783de980511b07a71a27e90444e399a  /tmp/sourcingos-next-16-3-3.patch" | sha256sum --check --strict

      - name: Apply Claude-reviewed two-commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SourcingOS Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git am /tmp/sourcingos-next-16-3-3.patch

      - name: Install exact dependencies
        working-directory: next-public
        run: npm ci

      - name: Typecheck
        working-directory: next-public
        run: npm run typecheck

      - name: Lint
        working-directory: next-public
        run: npm run lint

      - name: Test
        working-directory: next-public
        run: npm test

      - name: Production build
        working-directory: next-public
        run: npm run build

      - name: Dependency audit
        working-directory: next-public
        run: npm audit --audit-level=moderate

      - name: Assert migrated framework version
        working-directory: next-public
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').dependencies.next")" = "16.3.3"
          test "$(node -p "require('./package.json').dependencies['@next/mdx']")" = "16.3.3"
          node -p "require('next/package.json').version" | grep -Fx '16.3.3'

      - name: Remove temporary transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .next16-patch .github/workflows/apply-next16-exact.yml
          git commit -m "Remove temporary Next 16 transfer scaffolding"

      - name: Push verified migration branch
        run: git push origin HEAD:chore/next-16-3-3
