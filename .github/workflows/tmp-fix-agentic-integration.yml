name: Temporary fix agentic integration

on:
  push:
    branches: [v30-agentic-search-pr4-hardened]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v30-agentic-search-pr4-hardened
          fetch-depth: 0
      - name: Repair helper and remove fixer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-agentic-integration.yml')
          text = p.read_text()
          text = text.replace("'''.replace(/^          /gm, ''))", "''')")
          p.write_text(text)
          Path('.github/workflows/tmp-fix-agentic-integration.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix agentic integration helper"
          git push origin HEAD:v30-agentic-search-pr4-hardened
