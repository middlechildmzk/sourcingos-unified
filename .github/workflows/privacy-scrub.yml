name: Temporary Privacy Scrub

on:
  push:
    branches:
      - privacy-firewall-scrub

permissions:
  contents: write

jobs:
  scrub:
    if: ${{ !contains(github.event.head_commit.message, '[privacy-scrub]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: privacy-firewall-scrub
          fetch-depth: 0

      - name: Sanitize public repository text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          ignored_dirs = {'.git', 'node_modules', '.next', 'dist', 'build', 'coverage'}
          allowed_exts = {'.ts','.tsx','.js','.jsx','.md','.json','.yml','.yaml','.html','.css','.sql','.txt','.env','.example'}
          ignored_files = {'package-lock.json', 'privacy-scrub.yml', 'public-repo-privacy-firewall.test.ts'}

          def s(*parts):
              return ''.join(parts)

          replacements = {
              s('Dan',' Larson'): 'SourcingOS Editorial',
              s('Daniel',' Larson'): 'SourcingOS Editorial',
              s('Max','imus'): 'Example Federal Integrator',
              s('PO','TFF'): 'human performance program',
              s('H','2F'): 'readiness program',
              s('Warrior',' Care'): 'recovery support',
              s('Recovery',' Care'): 'rehabilitation support',
              s('Force and Family',' Readiness'): 'readiness support',
              s('USSO','COM'): 'federal mission organization',
              s('Capitol',' Careers'): 'recruiting partner',
              s('realmiddlechildmzk','@gmail.com'): 'editorial@sourcingos.com',
              s('Dllarson1991','@gmail.com'): 'editorial@sourcingos.com',
          }

          changed = []
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              if any(part in ignored_dirs for part in p.parts):
                  continue
              if p.name in ignored_files or p.suffix.lower() not in allowed_exts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))

          print(f'Sanitized {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Commit sanitized tree
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[privacy-scrub] sanitize public repository identifiers"
          git push origin HEAD:privacy-firewall-scrub
