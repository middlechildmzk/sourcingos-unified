name: V40.7b lockfile sync

on:
  push:
    branches:
      - v40-7b-inngest-fleet-runtime
    paths:
      - 'next-public/package.json'
      - '.github/workflows/v40-7b-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: next-public
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v40-7b-inngest-fleet-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Sync lockfile for Inngest runtime'
          git fetch origin v40-7b-inngest-fleet-runtime
          git rebase origin/v40-7b-inngest-fleet-runtime
          git push origin HEAD:v40-7b-inngest-fleet-runtime
