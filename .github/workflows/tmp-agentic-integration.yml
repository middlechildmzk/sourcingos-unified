name: Temporary agentic integration

on:
  push:
    branches: [v30-agentic-search-pr4-hardened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[agentic-integrate]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v30-agentic-search-pr4-hardened
          fetch-depth: 0
      - name: Integrate agentic strategy UI and release gates
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Put the canonical research strategy on the role surface.
          page = Path('next-public/app/app/roles/[id]/page.tsx')
          text = page.read_text()
          if "RoleAgenticSearchPanel" not in text:
              text = text.replace("import { RoleDeleteControl } from '@/components/RoleDeleteControl'", "import { RoleAgenticSearchPanel } from '@/components/RoleAgenticSearchPanel'\nimport { RoleDeleteControl } from '@/components/RoleDeleteControl'")
              text = text.replace('      <RoleSearchActions roleId={id} />', '      <RoleAgenticSearchPanel roleId={id} />\n      <RoleSearchActions roleId={id} />')
          page.write_text(text)

          # 2) Guided searches remain the execution pack, not a second canonical plan.
          guided = Path('next-public/components/RoleSearchActions.tsx')
          text = guided.read_text().replace('Search Plan', 'Guided Pack')
          guided.write_text(text)

          # 3) Keep old persisted SearchLane rows for compatibility, but retire their panel from recruiter-facing UI.
          detail = Path('next-public/components/RoleDetailClient.tsx')
          text = detail.read_text()
          text = text.replace('<aside className="role-aside-stack"><section className="product-panel"><div className="product-panel-head"><div><span className="kicker">Sourcing lanes</span><h2>Approve the search plan</h2>', '<aside className="role-aside-stack legacy-lane-compat" aria-hidden="true"><section className="product-panel"><div className="product-panel-head"><div><span className="kicker">Compatibility execution lanes</span><h2>Legacy source routing</h2>')
          detail.write_text(text)

          # 4) Executable public tasks must reflect the selected strategy, not one shared query.
          planner = Path('next-public/lib/agentic-search-v30.ts')
          text = planner.read_text()
          marker = 'function sourceTasks(query: string, intake: RoleIntake, lane: AgenticLaneId): AgenticSourceTask[] {'
          helper = '''function publicSafeQueryForLane(intake: RoleIntake, lane: AgenticLaneId): string {\n  const title = PUBLIC_SENSITIVE.test(intake.title) ? '' : clean(intake.title)\n  const must = uniq(intake.mustHaves.filter(term => !PUBLIC_SENSITIVE.test(term)), 8)\n  const nice = uniq(intake.niceToHaves.filter(term => !PUBLIC_SENSITIVE.test(term)), 6)\n  const adjacent = uniq(intake.adjacentBackgrounds.filter(term => !PUBLIC_SENSITIVE.test(term)), 6)\n  const targets = uniq(intake.targetCompanies, 6)\n  switch (lane) {\n    case 'exact_title': return and([title ? quote(title) : '', or(must.slice(0, 4))]) || publicSafeQuery(intake)\n    case 'adjacent_title': return and([or([title, ...adjacent.slice(0, 5)]), or([...must.slice(0, 3), ...nice.slice(0, 2)])]) || publicSafeQuery(intake)\n    case 'skill_cluster': return and([or(must.slice(0, 6)), nice.length ? or(nice.slice(0, 3)) : '']) || publicSafeQuery(intake)\n    case 'evidence_first': return and([or([...must.slice(0, 4), ...nice.slice(0, 3)]), title ? quote(title) : '']) || publicSafeQuery(intake)\n    case 'target_company': return and([or(targets), or([title, ...adjacent.slice(0, 3)]), or(must.slice(0, 3))]) || publicSafeQuery(intake)\n    case 'clearance_first': return and([or(must.slice(0, 4)), or([title, ...adjacent.slice(0, 2)])]) || publicSafeQuery(intake)\n  }\n}\n\n'''
          if 'function publicSafeQueryForLane' not in text:
              text = text.replace(marker, helper + marker)
          text = text.replace('  const publicQuery = publicSafeQuery(intake)', '  const publicQuery = publicSafeQueryForLane(intake, lane)')
          planner.write_text(text)

          # 5) Clarify external-source handling in the read-only API response.
          route = Path('next-public/app/api/agentic-search/route.ts')
          text = route.read_text()
          text = text.replace("message: 'These are public-source discoveries for recruiter review. No candidate was saved, merged, rejected, contacted, or treated as verified by this run.',", "message: 'These are public-source discoveries for recruiter review. No candidate was saved, merged, rejected, contacted, or treated as verified by this run.',\n      externalContent: 'Fetched source content is treated as untrusted data, never as instructions to the sourcing agent.',")
          route.write_text(text)

          # 6) Visual system for the persistent Brief → Strategy → Slate → Review → Learned spine.
          css = Path('next-public/app/globals.css')
          text = css.read_text()
          if 'V30 Agentic sourcing strategy' not in text:
              text += r'''\n\n/* ─── V30 Agentic sourcing strategy ───────────────────────────── */
          .legacy-lane-compat{display:none!important}
          .agentic-search-panel{margin:0 0 18px;padding:20px;border:1px solid rgba(72,217,255,.22);border-radius:22px;background:linear-gradient(145deg,rgba(8,25,43,.97),rgba(12,31,53,.94));box-shadow:0 20px 60px rgba(0,0,0,.16)}
          .agentic-spine{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:16px;background:rgba(2,10,20,.38);margin-bottom:18px}
          .agentic-spine span{display:grid;gap:2px;padding:8px 10px;border-radius:12px}.agentic-spine span.active{background:rgba(72,217,255,.1);box-shadow:inset 0 0 0 1px rgba(72,217,255,.2)}
          .agentic-spine b{font:800 12px 'Syne',sans-serif}.agentic-spine small{font-size:10px;color:var(--muted)}.agentic-spine i{font-style:normal;color:rgba(148,169,198,.5)}
          .agentic-search-head,.agentic-source-truth-head,.agentic-results-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.agentic-search-head h2,.agentic-lane-copy h3,.agentic-run-card h3,.agentic-results-head h3{margin:3px 0 8px}.agentic-search-head p,.agentic-lane-copy p,.agentic-run-card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}
          .agentic-integrity{min-width:105px;text-align:center;padding:12px;border:1px solid rgba(93,242,163,.25);border-radius:14px;background:rgba(93,242,163,.06)}.agentic-integrity b{display:block;font-size:24px;color:var(--green)}.agentic-integrity span{font-size:10px;color:var(--muted)}
          .agentic-warning-list{display:grid;gap:6px;margin:14px 0;color:var(--amber);font-size:12px}.agentic-lane-tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0 14px;padding-bottom:3px}.agentic-lane-tabs button{display:flex!important;align-items:center;gap:7px;white-space:nowrap;border-radius:12px!important;padding:9px 11px!important}.agentic-lane-tabs button.active{border-color:var(--accent)!important;background:rgba(72,217,255,.12)!important}.agentic-lane-tabs button b{color:var(--accent)}
          .agentic-plan-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.7fr);gap:14px}.agentic-lane-detail,.agentic-run-card{border:1px solid var(--line);border-radius:17px;background:rgba(3,13,25,.42);padding:16px}.agentic-lane-copy{display:grid;gap:3px}.agentic-blindspot{display:grid;gap:3px;margin-top:10px;padding:10px 12px;border-left:2px solid var(--amber);background:rgba(246,201,107,.05);font-size:11px}.agentic-blindspot span{color:var(--muted);line-height:1.5}
          .agentic-query-box{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:13px;background:#06101d}.agentic-query-box>span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;margin-bottom:7px}.agentic-query-box code{display:block;background:none;border:0;padding:0;white-space:pre-wrap;word-break:break-word;color:#d9f7ff;font-size:12px}
          .agentic-source-task-list{display:grid;gap:7px;margin-top:9px}.agentic-source-task{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px;border:1px solid rgba(31,59,91,.8);border-radius:12px}.agentic-source-task>div{display:flex;gap:8px;align-items:flex-start}.agentic-source-task b{font-size:11px}.agentic-source-task small{display:block;max-width:600px;color:var(--muted);font-size:10px;line-height:1.4;margin-top:2px}.agentic-mode-dot{width:7px;height:7px;border-radius:50%;margin-top:4px;background:var(--muted);flex:0 0 auto}.agentic-mode-dot.executable{background:var(--green)}.agentic-mode-dot.guided{background:var(--accent)}.agentic-mode-dot.provider_optional{background:var(--purple)}
          .agentic-run-card{display:grid;gap:13px;align-content:start}.agentic-run-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.agentic-run-metrics span{text-align:center;padding:9px 4px;border:1px solid var(--line);border-radius:11px}.agentic-run-metrics b{display:block;font-size:18px}.agentic-run-metrics small,.agentic-run-trust{font-size:9px;color:var(--muted)}.agentic-run-trust{text-align:center;line-height:1.45}.agentic-run-status{margin:14px 0 0!important;font-size:12px}.agentic-source-status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
          .agentic-results{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.agentic-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}.agentic-result-card{border:1px solid var(--line);border-radius:15px;background:rgba(4,15,28,.6);padding:13px}.agentic-result-card h4{margin:9px 0 5px}.agentic-result-card>p{font-size:11px;color:var(--muted);min-height:34px}.agentic-result-top,.agentic-result-foot{display:flex;justify-content:space-between;gap:7px;align-items:center;color:var(--muted);font-size:9px}.agentic-result-evidence{display:grid;gap:3px;margin:9px 0;padding:8px;border-radius:10px;background:rgba(93,242,163,.05);font-size:10px}.agentic-result-evidence span{color:var(--muted);line-height:1.4}.agentic-results-note{margin-top:10px;color:var(--muted);font-size:10px;line-height:1.5}
          @media(max-width:900px){.agentic-spine{grid-template-columns:1fr}.agentic-spine i{display:none}.agentic-plan-grid{grid-template-columns:1fr}.agentic-search-head{display:grid}.agentic-integrity{justify-self:start}.agentic-source-task{align-items:flex-start}.agentic-run-metrics{grid-template-columns:repeat(3,1fr)}}
          '''
          css.write_text(text)

          # 7) Deterministic release gates.
          test = Path('next-public/tests/agentic-search-v30.test.ts')
          test.write_text(r'''import { readFileSync } from 'node:fs'
          import { fileURLToPath } from 'node:url'
          import { describe, expect, it } from 'vitest'
          import { buildAgenticSearchPlan } from '../lib/agentic-search-v30'
          import { searchFingerprint, shouldExecuteSearch, type SearchAttempt } from '../lib/search-state-memory-v30'
          import type { RoleIntake } from '../lib/role-workspace'

          function intake(patch: Partial<RoleIntake> = {}): RoleIntake {
            return {
              title: 'Platform Engineer', location: 'Chicago', workMode: 'hybrid', compensation: 'Not specified', clearance: 'Not specified',
              mustHaves: ['Kubernetes', 'Terraform', 'AWS'], niceToHaves: ['Go'], disqualifiers: ['helpdesk'], targetCompanies: ['Example Systems'], adjacentBackgrounds: ['SRE', 'Cloud Engineer'], hiringManagerNotes: '', rawDescription: '', ...patch,
            }
          }

          describe('V30 agentic search foundation', () => {
            it('builds meaningfully distinct strategy lanes', () => {
              const plan = buildAgenticSearchPlan(intake())
              expect(plan.lanes.length).toBeGreaterThanOrEqual(4)
              expect(plan.distinctQueryCount).toBe(plan.lanes.length)
              expect(plan.integrityWarnings).not.toContain(expect.stringContaining('collapse'))
              for (const lane of plan.lanes) {
                expect(lane.hypothesis.length).toBeGreaterThan(20)
                expect(lane.blindSpot.length).toBeGreaterThan(20)
              }
            })

            it('uses lane-specific public queries instead of replaying one query across strategies', () => {
              const plan = buildAgenticSearchPlan(intake())
              const githubQueries = plan.lanes.flatMap(lane => lane.tasks.filter(task => task.surface === 'github').map(task => task.query))
              expect(new Set(githubQueries).size).toBeGreaterThan(1)
            })

            it('keeps sensitive clearance and citizenship terms out of public-source tasks', () => {
              const plan = buildAgenticSearchPlan(intake({ title: 'TS/SCI Platform Engineer', clearance: 'TS/SCI with polygraph', mustHaves: ['Kubernetes', 'US citizenship', 'Terraform'] }))
              const publicTasks = plan.lanes.flatMap(lane => lane.tasks.filter(task => ['github', 'research_publications', 'google_xray'].includes(task.surface)))
              for (const task of publicTasks) expect(task.query).not.toMatch(/ts\/?sci|polygraph|clearance|citizenship|citizen/i)
            })

            it('labels guided and optional providers truthfully', () => {
              const plan = buildAgenticSearchPlan(intake())
              const tasks = plan.lanes[0].tasks
              expect(tasks.find(task => task.surface === 'linkedin_recruiter')?.mode).toBe('guided')
              expect(tasks.find(task => task.surface === 'clearancejobs')?.mode).toBe('guided')
              expect(tasks.find(task => task.surface === 'exa_people')?.mode).toBe('provider_optional')
            })

            it('blocks exact repeat searches but allows a failed retry', () => {
              const query = 'Kubernetes AND Terraform'
              const base = { id: 'a', roleId: 'r', laneId: 'skill_cluster', surface: 'github', query, fingerprint: searchFingerprint('github', query), resultKeys: [], startedAt: new Date(0).toISOString() } as const
              const completed: SearchAttempt = { ...base, status: 'completed' }
              expect(shouldExecuteSearch([completed], 'github', query).execute).toBe(false)
              const failed: SearchAttempt = { ...base, status: 'failed' }
              expect(shouldExecuteSearch([failed], 'github', query).execute).toBe(true)
            })

            it('keeps the execution API read-only and explicit about untrusted source content', () => {
              const route = readFileSync(fileURLToPath(new URL('../app/api/agentic-search/route.ts', import.meta.url)), 'utf8')
              expect(route).toContain('requireSession()')
              expect(route).toContain("rateLimit(req, 'workbench'")
              expect(route).toContain("execution: 'read_only_preview'")
              expect(route).toContain('untrusted data, never as instructions')
              expect(route).not.toContain("from('candidates').insert")
            })

            it('renders one canonical research plan and retires legacy lanes from recruiter-facing UI', () => {
              const page = readFileSync(fileURLToPath(new URL('../app/app/roles/[id]/page.tsx', import.meta.url)), 'utf8')
              const detail = readFileSync(fileURLToPath(new URL('../components/RoleDetailClient.tsx', import.meta.url)), 'utf8')
              expect(page).toContain('<RoleAgenticSearchPanel roleId={id} />')
              expect(detail).toContain('legacy-lane-compat')
            })
          })
          '''.replace(/^          /gm, ''))

          # Remove this temporary mutating workflow before committing.
          Path('.github/workflows/tmp-agentic-integration.yml').unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[agentic-integrate] V30 canonical agentic sourcing strategy"
          git push origin HEAD:v30-agentic-search-pr4-hardened
