name: V40.2 Integration Gate

on:
  push:
    branches:
      - v40-2-autonomous-fleet-integration
    paths:
      - '.v40-2/**'
      - '.github/workflows/v40-2-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v40-2-autonomous-fleet-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-public/package-lock.json

      - name: Reconstruct and reconcile reviewed staging archive
        shell: bash
        run: |
          set -euo pipefail
          cat .v40-2/chunk* > /tmp/v40-stage.b64
          base64 -d /tmp/v40-stage.b64 > /tmp/v40-stage.tgz
          test "$(sha256sum /tmp/v40-stage.tgz | cut -d' ' -f1)" = "206de6bc2ec9059e46704edc6785b62fc8a18c7a7effb8f17951461d623ce0b7"
          tar -xzf /tmp/v40-stage.tgz -C .

          python - <<'PY'
          from pathlib import Path

          def add_once(path, marker, replacement):
              p = Path(path)
              text = p.read_text()
              if replacement in text:
                  return
              if marker not in text:
                  raise SystemExit(f'marker not found in {path}: {marker!r}')
              p.write_text(text.replace(marker, replacement, 1))

          sites_union = "  | 'rubygems'\n  | 'serverfault'\n  | 'security_se'\n  | 'devops_se'\n  | 'unix_se'\n  | 'dba_se'\n  | 'networkeng_se'\n  | 'resume_xray'"
          add_once('next-public/lib/candidate-db-v18.ts', "  | 'rubygems'\n  | 'resume_xray'", sites_union)

          source_union = "  | 'rubygems'\n  // Stack Exchange network sites beyond Stack Overflow retain site-level provenance.\n  | 'serverfault'\n  | 'security_se'\n  | 'devops_se'\n  | 'unix_se'\n  | 'dba_se'\n  | 'networkeng_se'\n  | 'resume_xray'"
          add_once('next-public/lib/source-types.ts', "  | 'rubygems'\n  | 'resume_xray'", source_union)
          add_once('next-public/lib/source-types.ts', "  'pypi', 'kaggle', 'devto', 'dockerhub', 'crates', 'rubygems',\n  'resume_xray'", "  'pypi', 'kaggle', 'devto', 'dockerhub', 'crates', 'rubygems',\n  'serverfault', 'security_se', 'devops_se', 'unix_se', 'dba_se', 'networkeng_se',\n  'resume_xray'")
          add_once('next-public/lib/source-types.ts', "  rubygems: 'RubyGems',\n  resume_xray: 'Public Resume X-Ray',", "  rubygems: 'RubyGems',\n  serverfault: 'Server Fault',\n  security_se: 'Information Security Stack Exchange',\n  devops_se: 'DevOps Stack Exchange',\n  unix_se: 'Unix & Linux Stack Exchange',\n  dba_se: 'Database Administrators Stack Exchange',\n  networkeng_se: 'Network Engineering Stack Exchange',\n  resume_xray: 'Public Resume X-Ray',")
          add_once('next-public/lib/source-types.ts', "  technical: ['github', 'stackoverflow', 'npm', 'pypi', 'dockerhub', 'crates', 'rubygems', 'devto'],\n  research:", "  technical: ['github', 'stackoverflow', 'npm', 'pypi', 'dockerhub', 'crates', 'rubygems', 'devto'],\n  infrastructure: ['serverfault', 'unix_se', 'devops_se', 'networkeng_se', 'dba_se', 'github'],\n  security: ['security_se', 'serverfault', 'github', 'stackoverflow'],\n  research:")
          PY

          git apply --check --exclude=next-public/lib/candidate-db-v18.ts --exclude=next-public/lib/source-types.ts .integration/claude-stack-npi.patch
          git apply --exclude=next-public/lib/candidate-db-v18.ts --exclude=next-public/lib/source-types.ts .integration/claude-stack-npi.patch

          python - <<'PY'
          from pathlib import Path
          p = Path('.integration/apply.py')
          s = p.read_text()
          s = s.replace("subprocess.run(['git', 'apply', '--check', '.integration/claude-stack-npi.patch'], check=True)\n", '')
          s = s.replace("subprocess.run(['git', 'apply', '.integration/claude-stack-npi.patch'], check=True)\n", '')
          p.write_text(s)
          PY
          python .integration/apply.py

          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'test marker missing in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_required(
              'next-public/tests/autosource-v22.test.ts',
              "  it('does not schedule unattended autosource while trust hardening is in progress', () => {\n    expect(vercel).toContain('\"crons\": []')\n    expect(vercel).not.toContain('/api/cron/autosource')\n  })",
              "  it('schedules only the hardened V40.2 fleet endpoint for unattended discovery', () => {\n    const fleetCron = read('app/api/cron/fleet/route.ts')\n    expect(vercel).toContain('/api/cron/fleet')\n    expect(vercel).toContain('*/30 * * * *')\n    expect(vercel).not.toContain('/api/cron/autosource')\n    expect(fleetCron).toContain('authorizeCronRequest')\n    expect(fleetCron).toContain('claimDueFleetLanesV40')\n    expect(fleetCron).toContain('runFleetLaneV40')\n  })",
          )

          replace_required(
              'next-public/tests/v33-2-unified-agent-source-truth.test.ts',
              "    expect(vercel).toContain('\"crons\": []')\n",
              "    const fleetCron = read('app/api/cron/fleet/route.ts')\n    expect(vercel).toContain('/api/cron/fleet')\n    expect(vercel).toContain('*/30 * * * *')\n    expect(vercel).not.toContain('/api/cron/autosource')\n    expect(fleetCron).toContain('authorizeCronRequest')\n",
          )
          replace_required('next-public/tests/v33-2-unified-agent-source-truth.test.ts', "  it('keeps unattended acquisition discovery-only until recruiter review', () => {", "  it('keeps scheduled unattended acquisition discovery-only until recruiter review', () => {")

          p = Path('next-public/tests/v40-agentic-foundation.test.ts')
          text = p.read_text()
          marker = "const capture = read('lib/candidate-data/auto-capture-v40.ts')\n"
          if marker not in text:
              raise SystemExit('V40 capture test marker missing')
          text = text.replace(marker, marker + "const captureStore = read('lib/candidate-data/capture-source-result-v40.ts')\n", 1)
          text = text.replace("    expect(capture).toContain(\"status: 'pending'\")", "    expect(captureStore).toContain(\"status: 'pending'\")", 1)
          text = text.replace("    expect(capture).toContain(\"merge_status: 'pending'\")", "    expect(captureStore).toContain(\"merge_status: 'pending'\")", 1)
          text = text.replace("    expect(capture).toContain('Automatically captured provider observation')", "    expect(captureStore).toContain('Automatically captured ${normalized.source} observation.')", 1)
          text = text.replace("    expect(capture).toContain('createDeterministicIdentityProposals')", "    expect(captureStore).toContain('createDeterministicIdentityProposals')", 1)
          p.write_text(text)
          PY

      - name: Install locked dependencies
        working-directory: next-public
        run: npm ci

      - name: Typecheck
        working-directory: next-public
        run: npm run typecheck

      - name: Targeted V40.2 fleet tests
        working-directory: next-public
        run: npx vitest run tests/fleet-nppes-scout.test.ts tests/fleet-stack-network.test.ts tests/fleet-orcid-scout.test.ts tests/fleet-standing-fleet.test.ts tests/v40-2-autonomous-fleet-integration.test.ts tests/autosource-v22.test.ts tests/v33-2-unified-agent-source-truth.test.ts tests/v40-agentic-foundation.test.ts

      - name: Full deterministic suite
        working-directory: next-public
        run: npm test

      - name: Commit integrated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .integration .v40-2
          rm -f .github/workflows/v40-2-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "$(printf 'github-actions[bot]%susers.noreply.github.com' '@')"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V40.2: integrate autonomous public-source fleet"
          git push origin HEAD:v40-2-autonomous-fleet-integration
