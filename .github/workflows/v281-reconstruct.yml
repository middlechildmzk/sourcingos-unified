name: V28.1 one-time reconstruction

on:
  push:
    branches:
      - v28-1-product-truth-reconstruction
    paths:
      - scripts/v281-reconstruct.mjs
      - scripts/v281-drawer-transform.mjs
      - scripts/v281-candidate-db-transform.mjs
      - scripts/v281-final-source-transforms.mjs
      - .github/workflows/v281-reconstruct.yml

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v28-1-product-truth-reconstruction
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic transforms
        run: |
          node scripts/v281-reconstruct.mjs
          node scripts/v281-drawer-transform.mjs
          node scripts/v281-candidate-db-transform.mjs
          node scripts/v281-final-source-transforms.mjs
      - name: Commit transformed source
        run: |
          if git diff --quiet; then
            echo "No transformation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next-public/components/WorkbenchClient.tsx next-public/components/CandidateDrawer.tsx next-public/components/CandidateDbClient.tsx next-public/lib/source-connectors.ts
          git commit -m "Complete V28.1 recruiter interaction and source truth safeguards"
          git push origin HEAD:v28-1-product-truth-reconstruction
